<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>章鱼哥的世界杯 · 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #080810;
  --bg-1: #121224;
  --bg-2: #1a1a36;
  --water-0: #0a3050;
  --water-1: #154878;
  --water-2: #2a70a8;
  --water-3: #5a9ec8;
  --text-0: #8892a8;
  --text-1: #c0c8d8;
  --text-2: #f0f2f8;
  --blood: #c0392b;
  --blood-2: #e74c3c;
  --gold: #f5c518;
  --green: #27ae60;
  --fire-0: #e85d3a;
  --fire-1: #f08a5d;
  --fire-2: #f9d56e;
  --radius: 6px;
  --shadow: 0 2px 12px rgba(0,0,0,.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg-0);
  color: var(--text-2);
  font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  overflow: hidden;
  user-select: none;
}
button, input { font-family: inherit; }

.main {
  display: grid;
  grid-template-columns: 1fr 340px;
  height: 100vh;
}

/* ===== 顶栏 ===== */
.top-bar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  background: var(--bg-1);
  border-bottom: 2px solid rgba(255,255,255,.08);
  z-index: 10;
  gap: 16px;
}
.brand {
  font-size: 18px;
  font-weight: 800;
  color: var(--gold);
  letter-spacing: -.3px;
  white-space: nowrap;
}
.top-status {
  display: flex;
  gap: 16px;
}
.stat {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 6px 14px;
  background: var(--bg-2);
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
}
.stat .lbl { color: var(--text-0); }
.stat .val { color: var(--gold); font-size: 16px; font-weight: 700; }
.stat.danger .val { color: var(--blood-2); }
.stat .val.ok { color: var(--green); }

.clock {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 500;
  color: var(--water-3);
  letter-spacing: 1px;
}

/* ===== 主舞台 ===== */
.stage {
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 12px;
  min-height: 0;
}

.tank {
  flex: 1;
  position: relative;
  background:
    radial-gradient(ellipse at 30% 10%, rgba(90,158,200,.15) 0%, transparent 50%),
    linear-gradient(180deg, var(--water-1) 0%, var(--water-0) 100%);
  border: 3px solid rgba(255,255,255,.12);
  border-radius: 10px;
  overflow: hidden;
  min-height: 0;
}

.sand {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 30px;
  background: linear-gradient(0deg, #8a6a3a, #c4a060);
  z-index: 1;
}

.seaweed {
  position: absolute;
  bottom: 0;
  width: 18px;
  z-index: 1;
  background: linear-gradient(0deg, #1a4a1a, #2a6a2a);
  border-radius: 40% 40% 0 0;
  animation: sway 4s ease-in-out infinite;
  transform-origin: bottom center;
}
@keyframes sway {
  0%,100%{transform:rotate(-4deg)}
  50%{transform:rotate(4deg)}
}

.bubble {
  position: absolute;
  bottom: 0;
  background: var(--water-3);
  border-radius: 50%;
  opacity: .35;
  animation: rise linear infinite;
  z-index: 2;
}
@keyframes rise {
  0%{transform:translateY(0)translateX(0);opacity:0}
  10%{opacity:.35}
  100%{transform:translateY(-120vh)translateX(15px);opacity:0}
}

/* ===== 球队区 ===== */
.pool {
  position: absolute;
  top: 25%;
  bottom: 0;
  width: 38%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  z-index: 2;
}
.pool.left{left:0}
.pool.right{right:0}

.pool-bg {
  position: absolute;
  inset: 0;
  background: var(--water-2);
  opacity: .06;
  z-index: -1;
  border-radius: 8px;
}
.pool.win .pool-bg{background:var(--gold);opacity:.12}
.pool.lose .pool-bg{background:var(--blood);opacity:.15}

.flag {
  font-size: 72px;
  width: 100px;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-1);
  border-radius: 8px;
  border: 2px solid rgba(255,255,255,.1);
}
.pool-name {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-2);
  padding: 6px 18px;
  background: rgba(0,0,0,.4);
  border-radius: var(--radius);
}
.pool-rank {
  font-size: 14px;
  color: var(--text-0);
  background: rgba(0,0,0,.3);
  padding: 4px 12px;
  border-radius: var(--radius);
}

/* ===== 保罗 ===== */
.octopus {
  position: absolute;
  top: 50%;
  left: 50%;
  z-index: 5;
  transform: translate(-50%,-50%);
  transition: left 2.5s cubic-bezier(.4,0,.2,1), top 2s ease-in-out;
  pointer-events: auto;
  cursor: pointer;
}
.octopus-emoji {
  font-size: 160px;
  line-height: 1;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,.5));
  animation: swim 3s ease-in-out infinite;
}
@keyframes swim {
  0%,100%{transform:translateY(0)rotate(-2deg)scale(1)}
  50%{transform:translateY(-8px)rotate(2deg)scale(1.03)}
}

.octopus.dying .octopus-emoji {
  animation: dying .15s steps(3) infinite;
  filter: sepia(1) hue-rotate(-20deg) saturate(2) brightness(1.1);
}
@keyframes dying {
  0%,100%{transform:translate(0,0)rotate(0)}
  33%{transform:translate(-4px,2px)rotate(-8deg)}
  66%{transform:translate(3px,-1px)rotate(6deg)}
}

/* ===== 对阵信息 ===== */
.center-overlay {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  z-index: 6;
  text-align: center;
  pointer-events: none;
}
.match-headline {
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
  background: rgba(0,0,0,.7);
  padding: 10px 22px;
  border-radius: var(--radius);
  border: 1px solid rgba(245,197,24,.3);
}
.match-sub {
  font-size: 14px;
  color: var(--text-0);
  background: rgba(0,0,0,.5);
  padding: 5px 14px;
  border-radius: var(--radius);
  font-family: 'JetBrains Mono', monospace;
}

.match-vs {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  font-size: 18px;
  font-weight: 800;
  color: var(--gold);
  background: rgba(0,0,0,.7);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 4;
  border: 2px solid rgba(245,197,24,.4);
}

.score-overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 64px;
  font-weight: 700;
  color: var(--gold);
  background: rgba(0,0,0,.85);
  padding: 12px 28px;
  border-radius: 12px;
  z-index: 7;
  display: none;
}
.score-overlay.show{display:block;animation:pop .3s ease-out both}
@keyframes pop {
  0%{transform:translate(-50%,-50%)scale(.3);opacity:0}
  100%{transform:translate(-50%,-50%)scale(1);opacity:1}
}

.tb-box {
  position: absolute;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 6;
}
.tb-box .box {
  background: rgba(0,0,0,.6);
  border-radius: var(--radius);
  padding: 6px 14px;
  text-align: center;
  min-width: 90px;
}
.tb-box .k{color:var(--text-0);font-size:10px;font-weight:500}
.tb-box .v{color:var(--gold);font-size:15px;font-weight:700;font-family:'JetBrains Mono',monospace}
.tb-box .v.ok{color:var(--green)}
.tb-box .v.danger{color:var(--blood-2)}

/* ===== 操作栏 ===== */
.action-bar {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  background: var(--bg-1);
  border-radius: var(--radius);
  flex-wrap: wrap;
}
.btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-2);
  color: var(--text-1);
  border: 2px solid rgba(255,255,255,.1);
  border-radius: var(--radius);
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.btn:hover:not(:disabled){
  background: var(--water-2);
  border-color: var(--water-3);
  color: #fff;
}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn .ico{font-size:18px}

.btn.feed-home{border-color:rgba(245,197,24,.4);color:var(--gold)}
.btn.feed-home:hover:not(:disabled){background:rgba(245,197,24,.15)}
.btn.feed-away{border-color:rgba(90,158,200,.4);color:var(--water-3)}
.btn.feed-away:hover:not(:disabled){background:rgba(90,158,200,.15)}
.btn.predict{
  background: linear-gradient(135deg,rgba(90,158,200,.2),rgba(245,197,24,.1));
  border-color:rgba(245,197,24,.35);
  color:var(--gold);
  animation: glow 2.5s ease-in-out infinite;
}
.btn.predict:hover:not(:disabled){background:linear-gradient(135deg,rgba(90,158,200,.35),rgba(245,197,24,.2))}
@keyframes glow {
  0%,100%{box-shadow:0 0 8px rgba(245,197,24,.1)}
  50%{box-shadow:0 0 16px rgba(245,197,24,.25)}
}
.btn.bet{color:var(--fire-1);border-color:rgba(232,93,58,.35)}
.btn.log{color:var(--green);border-color:rgba(39,174,96,.35)}

/* 导航 */
.nav-group {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-right: 4px;
}
.nav-btn {
  width: 36px;
  height: 36px;
  padding: 0 !important;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  border-radius: var(--radius);
  border: 2px solid rgba(255,255,255,.15);
  background: var(--bg-2);
  color: var(--text-1);
  cursor: pointer;
}
.nav-btn:hover{background:var(--water-2);color:#fff}
.nav-info {
  font-size: 13px;
  font-weight: 600;
  color: var(--water-3);
  min-width: 55px;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
}

/* 预测泡泡 */
.predict-bubble {
  position: absolute;
  background: rgba(0,0,0,.85);
  border: 1px solid var(--gold);
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--gold);
  z-index: 20;
  pointer-events: none;
  animation: think-float 2s ease-out forwards;
  white-space: nowrap;
  border-radius: 8px;
}
@keyframes think-float {
  0%{opacity:0;transform:translateY(10px)}
  15%{opacity:1;transform:translateY(0)}
  85%{opacity:1;transform:translateY(-25px)}
  100%{opacity:0;transform:translateY(-50px)}
}

/* 章鱼点击推理气泡 */
.reason-bubble {
  position: absolute;
  background: rgba(10,10,30,.94);
  border: 2px solid rgba(245,197,24,.5);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 13px;
  color: var(--text-2);
  z-index: 30;
  pointer-events: none;
  max-width: 280px;
  line-height: 1.7;
  box-shadow: 0 8px 32px rgba(0,0,0,.6), 0 0 16px rgba(245,197,24,.15);
  animation: reason-in .3s ease-out;
}
.reason-bubble::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 8px solid rgba(245,197,24,.5);
}
@keyframes reason-in {
  0%{opacity:0;transform:translateY(10px)scale(.9)}
  100%{opacity:1;transform:translateY(0)scale(1)}
}
.reason-bubble .r-title {
  color: var(--gold);
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.reason-bubble .r-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 12px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.reason-bubble .r-row .r-lbl{color:var(--text-0)}
.reason-bubble .r-row .r-val{font-weight:600;font-family:'JetBrains Mono',monospace}
.reason-bubble .r-row .r-val.high{color:var(--green)}
.reason-bubble .r-row .r-val.mid{color:var(--gold)}
.reason-bubble .r-row .r-val.low{color:var(--blood-2)}
.reason-bubble .r-conclusion {
  margin-top: 8px;
  padding: 8px 12px;
  background: rgba(245,197,24,.08);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--gold);
  text-align: center;
}

/* ===== 侧边栏 ===== */
.sidebar {
  background: var(--bg-1);
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-left: 2px solid rgba(255,255,255,.06);
}
.sidebar-header {
  padding: 14px 16px;
  background: var(--bg-2);
  border-bottom: 2px solid rgba(255,255,255,.06);
}
.sidebar-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--gold);
}
.sidebar-sub {
  font-size: 11px;
  color: var(--text-0);
  margin-top: 4px;
  line-height: 1.6;
}
.timeline {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.1) transparent;
}
.timeline::-webkit-scrollbar{width:5px}
.timeline::-webkit-scrollbar-track{background:transparent}
.timeline::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}

.tl-day{margin-bottom:14px}
.tl-day-header {
  font-size: 13px;
  font-weight: 700;
  color: var(--gold);
  padding: 6px 10px;
  background: var(--bg-2);
  border-radius: var(--radius);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}
.tl-day-header .count{color:var(--text-0);font-size:11px;font-weight:500}
.tl-match {
  display: grid;
  grid-template-columns: 42px 1fr auto;
  gap: 8px;
  padding: 8px 10px;
  margin-bottom: 4px;
  background: var(--bg-0);
  border-radius: var(--radius);
  border: 2px solid transparent;
  font-size: 12px;
  line-height: 1.5;
  cursor: pointer;
  transition: all .15s;
}
.tl-match:hover{background:var(--bg-2);border-color:rgba(255,255,255,.08)}
.tl-match.current{border-color:var(--gold);background:var(--bg-2);box-shadow:0 0 10px rgba(245,197,24,.15)}
.tl-match.past{opacity:.5}
.tl-match.past.dead{border-left:4px solid var(--blood)}
.tl-match.past.alive{border-left:4px solid var(--green)}

.tl-time{color:var(--water-3);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500}
.tl-teams{display:flex;flex-direction:column;gap:1px}
.tl-team{display:flex;gap:5px;align-items:center;font-size:12px;font-weight:600}
.tl-team .emo{font-size:14px}
.tl-team.home{color:var(--gold)}
.tl-team.away{color:var(--water-3)}
.tl-group{color:var(--text-0);font-size:10px;margin-top:1px}
.tl-status{font-size:10px;font-weight:600}
.tl-tag{padding:1px 5px;border-radius:3px}
.tl-tag.live{color:var(--blood-2);animation:blink 1s steps(2)infinite}
.tl-tag.done{color:var(--green)}
.tl-tag.next{color:var(--gold)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.sidebar-footer {
  padding: 12px 16px;
  background: var(--bg-2);
  border-top: 2px solid rgba(255,255,255,.06);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.sf-box{background:var(--bg-0);border-radius:var(--radius);padding:8px 10px}
.sf-box .k{color:var(--text-0);font-size:11px}
.sf-box .v{color:var(--gold);font-size:16px;font-weight:700;font-family:'JetBrains Mono',monospace}
.sf-box.danger .v{color:var(--blood-2)}

/* ===== Modal ===== */
.modal-mask {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal-mask.show{display:flex}
.modal {
  background: var(--bg-1);
  border-radius: 12px;
  border: 2px solid rgba(255,255,255,.1);
  max-width: 460px;
  width: 100%;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 16px 48px rgba(0,0,0,.5);
}
.modal-head {
  padding: 14px 18px;
  border-bottom: 1px solid rgba(255,255,255,.08);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
  font-weight: 700;
  color: var(--gold);
}
.modal-close {
  background: var(--blood);
  color: #fff;
  border: none;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
}
.modal-body{padding:16px 18px;overflow-y:auto;font-size:13px;line-height:1.7}
.modal-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.modal-row .lbl{color:var(--text-0)}
.modal-row .val{color:var(--gold);font-weight:600}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:80px}

input.pixel-input {
  background: var(--bg-0);
  color: var(--text-2);
  border: 2px solid rgba(255,255,255,.1);
  border-radius: var(--radius);
  padding: 8px 12px;
  font-size: 14px;
  width: 100%;
  outline: none;
  font-family: 'JetBrains Mono', monospace;
}
input.pixel-input:focus{border-color:var(--gold)}

/* ===== BBQ ===== */
.bbq-overlay {
  position: fixed;inset:0;pointer-events:none;z-index:50;display:none;
}
.bbq-overlay.show{display:block}
.bbq-text {
  position: absolute;top:25%;left:50%;transform:translateX(-50%);
  font-size: 20px;font-weight:800;color:var(--fire-1);
  background:#000;padding:14px 28px;border-radius:10px;
  border:2px solid var(--fire-0);box-shadow:0 0 24px var(--fire-0);
  animation:shake .1s steps(2) infinite;
}
@keyframes shake {
  0%,100%{transform:translateX(-50%)translate(0,0)}
  25%{transform:translateX(-50%)translate(-2px,1px)}
  50%{transform:translateX(-50%)translate(2px,-1px)}
  75%{transform:translateX(-50%)translate(-1px,2px)}
}
.bbq-grill{position:absolute;bottom:25%;left:50%;transform:translateX(-50%);width:300px;height:160px}
.bbq-net{position:absolute;bottom:0;left:0;right:0;height:40px;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.15)0 4px,transparent 4px 8px),
  repeating-linear-gradient(-45deg,rgba(255,255,255,.15)0 4px,transparent 4px 8px);
  border:2px solid rgba(255,255,255,.2);border-radius:4px 4px 0 0}
.bbq-flame{position:absolute;bottom:25px;width:70px;height:100px;
  background:linear-gradient(0deg,var(--fire-0),var(--fire-1)50%,var(--fire-2)80%,transparent);
  border-radius:50% 50% 20% 20%/80% 80% 20% 20%;animation:flicker .15s steps(2) infinite;filter:blur(2px)}
.bbq-flame.f1{left:30px;height:110px}
.bbq-flame.f2{left:115px;height:140px;animation-delay:.05s}
.bbq-flame.f3{left:200px;height:100px;animation-delay:.1s}
@keyframes flicker {
  0%,100%{transform:scaleY(1)scaleX(1)}
  50%{transform:scaleY(1.12)scaleX(.9)translateY(-3px)}
}
.bbq-octopus{position:absolute;bottom:55px;left:50%;transform:translateX(-50%);font-size:70px;
  filter:sepia(.7)hue-rotate(-30deg)saturate(2)brightness(.8);animation:bbqspin 1.5s linear infinite}

.kill-flash{position:fixed;inset:0;background:var(--blood);z-index:999;pointer-events:none;animation:kill-f .6s steps(4) forwards}

function getKickoffDate(m){if(m.tbd)return null;return new Date(m.date+'T'+m.kickoff+':00+08:00')}
function fmtCountdown(ms){if(ms<0)ms=0;const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60);if(h>=24){const d=Math.floor(h/24);return d+'天 '+h%24+'h'}if(h>0)return h+'h '+m+'m';return m+'m'}
function fmtClock(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')}
function isSameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}

function findCurrentMatchIdx(){
  const now=Date.now();
  let nextUpcoming=-1,currentLive=-1;
  for(let i=0;i<SCHEDULE.length;i++){const m=SCHEDULE[i];if(m.tbd)continue;const ko=getKickoffDate(m);if(!ko)continue;const kt=ko.getTime();if(kt>now&&nextUpcoming===-1)nextUpcoming=i;if(kt<=now&&now<kt+2*3600*1000)currentLive=i}
  if(currentLive>=0){const v=state.history.find(h=>h.matchIdx===currentLive);if(!v||!v.verdict)return currentLive}
  for(let i=0;i<SCHEDULE.length;i++){const m=SCHEDULE[i];if(m.tbd)continue;const ko=getKickoffDate(m);if(!ko)continue;if(ko.getTime()>now)break;const v=state.history.find(h=>h.matchIdx===i);if(!v||!v.verdict)return i}
  if(nextUpcoming>=0)return nextUpcoming;
  return Math.min(state.currentMatchIdx,SCHEDULE.length-1);

function getH2H(home, away) {
  const k1 = home + '_' + away;
  const k2 = away + '_' + home;
  return HEAD2HEAD[k1] || HEAD2HEAD[k2] || null;
}

function octopusThink(match){
  const home=TEAMS[match.home],away=TEAMS[match.away];
  if(!home||!away)return{side:'home',factors:{}};

  // FIFA 排名因子
  const rankDiff=away.rank-home.rank;
  const rankScore=1/(1+Math.exp(-rankDiff/30));

  // 章鱼心情（随机）
  const mood=0.35+Math.random()*0.3;

  // 历史交锋因子
  const h2h=getH2H(match.home, match.away);
  let h2hScore = 0.5; // 默认均势
  if (h2h) {
    const total = h2h.home_wins + h2h.away_wins + h2h.draws;
    if (total > 0) h2hScore = (h2h.home_wins + h2h.draws*0.5) / total;
  }

  // 综合（去掉投喂因子，权重重新分配：FIFA排名 + 历史交锋 + 心情）
  const pHome=rankScore*0.45+h2hScore*0.3+mood*0.25;

  return {
    side: Math.random()<pHome?'home':'away',
    factors:{
      rank:Math.round(rankScore*100),
      h2h:Math.round(h2hScore*100),
      mood:Math.round(mood*100),
      pHome:Math.round(pHome*100),
      home:home,away:away,
      h2hData:h2h,
      wcHome:WC_HISTORY[match.home],
      wcAway:WC_HISTORY[match.away],
      rankDiff:rankDiff,
    }
  };
}

async function autoPredict(){
  const m=SCHEDULE[state.currentMatchIdx];

  const phase=getPhase(m);
  if(phase==='finished')return;

  const tank=$('#tank');
  const octo=$('#octopus');
  const tw=tank.clientWidth,th=tank.clientHeight;

  const think=octopusThink(m);
  const f=think.factors;

  // 动画：保罗游向中间
  octo.style.left=(tw*.5)+'px';
  octo.style.top=(th*.45)+'px';
  await sleep(600);

  // 吐出思考泡泡
  showBubble(tw*.48,th*.32,'🤔 FIFA差值: '+(f.away.rank-f.home.rank));
  await sleep(800);
  showBubble(tw*.48,th*.32,'🎲 保罗心情: '+(f.mood>60?'超好':f.mood>40?'还行':'一般'));
  await sleep(1000);

  // 游向选择方
  const targetX=think.side==='home'?tw*.15:tw*.85;
  octo.style.left=targetX+'px';
  octo.style.top=(th*.52)+'px';
  await sleep(1000);

  // 锁定
  state.currentPrediction=think.side;
  state.currentLocked=true;
  audio.beep();
  saveState();

  const chosen=think.side==='home'?f.home:f.away;
  toast('🐙 保罗选择了 '+chosen.flag+' '+chosen.name+'！');

  renderAll();
}

  const idx=state.currentMatchIdx,m=SCHEDULE[idx];if(!m)return;
  const predict=state.currentPrediction,correct=(result==='draw'?false:predict===result);
  state.history.push({matchIdx:idx,match:m.home+' vs '+m.away,prediction:predict,result,verdict:correct?'correct':'wrong',time:Date.now()});
  if(correct){state.correctCount++;audio.fanfare();$('#octopus').classList.add('dying');setTimeout(()=>$('#octopus').classList.remove('dying'),1500);toast('🎉 押中了！保罗得意地吐了口墨水。')}

  state.currentPrediction=null;state.currentLocked=false;state.deadId++;
  saveState();
  setTimeout(()=>{saveState();renderAll()},correct?2000:4500);
}

    '<div class="sf-box"><div class="k">存活</div><div class="v ok">'+state.octopusAlive+'</div></div>'+
    '<div class="sf-box danger"><div class="k">已烤</div><div class="v">'+state.octopusEaten+'</div></div>'+
    '<div class="sf-box"><div class="k">正确</div><div class="v ok">'+state.correctCount+'</div></div>'+
    '<div class="sf-box"><div class="k">错误</div><div class="v danger">'+state.wrongCount+'</div></div></div>'+
    '<p style="color:var(--gold);font-size:13px;font-weight:700;margin-bottom:8px">📜 历史战报</p>'+
    '<div style="max-height:300px;overflow-y:auto">'+
    (state.history.length===0?'<p style="color:var(--text-0);text-align:center;padding:20px">还没战绩。等待开赛。</p>':
    state.history.slice().reverse().map(h=>{const m=SCHEDULE[h.matchIdx];return'<div class="report-item"><div><div style="color:var(--text-2);font-size:12px">'+(m?m.date+' '+m.kickoff:'?')+'</div><div style="color:var(--text-0);font-size:11px">'+h.match+'</div></div><div class="ri-mid">押:'+(h.prediction==='home'?'主':h.prediction==='away'?'客':'—')+' → '+(h.result==='home'?'主':h.result==='away'?'客':'平')+'</div><div class="ri-outcome '+(h.verdict==='correct'?'win':'lose')+'">'+(h.verdict==='correct'?'✓ 活':'✕ 烤')+'</div></div>'}).join(''))+
    '</div><div class="btn-row"><button class="btn log" onclick="exportData()">💾 导出数据</button><button class="btn" style="color:var(--blood-2)" onclick="resetGame()">🗑 重置赛季</button></div>';
  openModal('📜 战报历史',body);
}

function openModal(t,b){$('#modal-title').textContent=t;$('#modal-body').innerHTML=b;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
let toastTimer=null;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='octopus-worldcup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);toast('已导出存档')}

/* ========== 音效 ========== */
let audioCtx=null;
function getCtx(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return audioCtx}
function beep(freq,dur,type='square',vol=.05){const ctx=getCtx();if(!ctx)return;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(vol,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+dur)}
const audio={
  beep:()=>beep(660,.05),
  shoot:()=>{beep(80,.4,'sawtooth',.2);setTimeout(()=>beep(40,.3,'sawtooth',.15),100)},
  scream:()=>{const ctx=getCtx();if(!ctx)return;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(900,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(60,ctx.currentTime+.6);gain.gain.setValueAtTime(.15,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.6);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.65)},
  sizzle:()=>{for(let i=0;i<12;i++)setTimeout(()=>beep(800+Math.random()*600,.04,'square',.04),i*60)},
  fanfare:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*100))},
};

function spawnBubbles(){const tank=$('#tank');tank.querySelectorAll('.bubble').forEach(b=>b.remove());for(let i=0;i<12;i++){const b=document.createElement('div');b.className='bubble';const s=4+Math.random()*8;b.style.width=s+'px';b.style.height=s+'px';b.style.left=(Math.random()*100)+'%';b.style.animationDuration=(5+Math.random()*8)+'s';b.style.animationDelay=(Math.random()*5)+'s';tank.appendChild(b)}}

function tick(){
  $('#clock').textContent=fmtClock(new Date());
  renderTop();renderStage();renderTimeline();renderBonePile();
}

function renderAll(){renderTop();renderStage();renderTimeline();renderBonePile()}

/* ========== 事件 ========== */
$('#btn-prev').addEventListener('click',()=>navMatch(-1));
$('#btn-next').addEventListener('click',()=>navMatch(1));
$('#octopus').addEventListener('click',(e)=>{e.stopPropagation();showOctopusReasoning()});
$('#btn-log').addEventListener('click',showReport);
$('#modal-close').addEventListener('click',closeModal);
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='ArrowLeft'){e.preventDefault();navMatch(-1)}
  if(e.key==='ArrowRight'){e.preventDefault();navMatch(1)}
  if(e.key==='l'||e.key==='L')showReport();
  if(e.key===' '){e.preventDefault();showResultInput()}
});
window.executeVerdict=executeVerdict;window.exportData=exportData;window.resetGame=resetGame;window.closeModal=closeModal;

function init(){
  spawnBubbles();
  state.currentMatchIdx=0;
  saveState();renderAll();
  setInterval(tick,1000);tick();
  setInterval(spawnBubbles,10*60*1000);
  document.addEventListener('click',()=>getCtx(),{once:true});
  autoPredict();
}
init();
</script>
</body>
</html>
