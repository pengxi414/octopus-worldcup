<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>章鱼哥的世界杯 · 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0a0a14;
  --bg-1: #15152a;
  --bg-2: #1f1f3a;
  --water-0: #0a3d62;
  --water-1: #1e5f8a;
  --water-2: #3a8cb8;
  --water-3: #6cb4d4;
  --pixel-0: #585858;
  --pixel-1: #a4a4a4;
  --pixel-2: #c0cbdc;
  --pixel-3: #f4f4f4;
  --blood: #b02a2a;
  --blood-2: #ff3a3a;
  --gold: #fbd000;
  --green: #00a651;
  --fire-0: #ff3a1a;
  --fire-1: #ff8a1a;
  --fire-2: #ffd84a;
  --shadow: rgba(0, 0, 0, 0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
html, body { height: 100%; }
body {
  background: var(--bg-0);
  color: var(--pixel-3);
  font-family: 'Press Start 2P', 'VT323', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 12px;
  line-height: 1.5;
  overflow: hidden;
  image-rendering: pixelated;
  text-rendering: optimizeLegibility;
  user-select: none;
}

button, input { font-family: inherit; image-rendering: pixelated; }

.main {
  display: grid;
  grid-template-columns: 1fr 320px;
  height: 100vh;
}

/* ===== 顶部栏 ===== */
.top-bar {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 24px;
  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border-bottom: 4px solid var(--pixel-0);
  box-shadow: 0 4px 0 var(--shadow);
  z-index: 10;
}

.brand {
  font-size: 16px;
  color: var(--gold);
  text-shadow: 2px 2px 0 var(--blood);
  letter-spacing: 1px;
  font-weight: bold;
}

.top-status {
  display: flex;
  gap: 12px;
}

.stat {
  display: flex;
  gap: 6px;
  align-items: center;
  padding: 8px 14px;
  background: var(--bg-0);
  border: 2px solid var(--pixel-0);
  box-shadow: inset 0 0 0 2px var(--bg-0), inset 0 0 0 4px var(--pixel-1);
  font-size: 10px;
}

.stat .lbl { color: var(--pixel-2); }
.stat .val { color: var(--gold); font-size: 13px; font-weight: bold; }
.stat.danger .val { color: var(--blood-2); }
.stat .val.ok { color: var(--green); }

.clock {
  font-family: 'VT323', monospace;
  font-size: 24px;
  color: var(--water-3);
  text-shadow: 0 0 6px var(--water-2);
  letter-spacing: 2px;
}

/* ===== 鱼缸 ===== */
.stage {
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 12px;
  min-height: 0;
}

.tank {
  flex: 1;
  position: relative;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(108, 180, 212, 0.3) 0%, transparent 50%),
    linear-gradient(180deg, var(--water-1) 0%, var(--water-0) 100%);
  border: 6px solid var(--pixel-2);
  box-shadow:
    inset 0 0 0 4px var(--pixel-0),
    inset 0 0 0 6px var(--pixel-2),
    inset 0 0 40px rgba(0, 0, 0, 0.5),
    0 0 0 4px var(--bg-0),
    0 0 0 8px var(--pixel-0);
  overflow: hidden;
  min-height: 0;
}

.tank::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 12px;
  background: repeating-linear-gradient(90deg, var(--water-3) 0 6px, transparent 6px 12px);
  z-index: 4;
  opacity: 0.6;
  animation: shimmer 4s linear infinite;
}

@keyframes shimmer {
  0% { transform: translateX(0); }
  100% { transform: translateX(-12px); }
}

.sand {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 36px;
  background: repeating-linear-gradient(90deg, #c9a066 0 4px, #a47a3a 4px 8px);
  border-top: 4px solid var(--pixel-0);
  z-index: 1;
}

.seaweed {
  position: absolute;
  bottom: 0;
  width: 24px;
  z-index: 1;
  background: linear-gradient(0deg, #2a5a2a 0%, #1a3a1a 100%);
  clip-path: polygon(50% 0, 70% 30%, 50% 60%, 80% 100%, 50% 100%, 30% 60%, 50% 30%);
  animation: sway 3s ease-in-out infinite;
  transform-origin: bottom center;
}

@keyframes sway {
  0%, 100% { transform: rotate(-5deg); }
  50% { transform: rotate(5deg); }
}

.bubble {
  position: absolute;
  bottom: 0;
  background: var(--water-3);
  border-radius: 50%;
  opacity: 0.5;
  animation: rise linear infinite;
  z-index: 2;
}

@keyframes rise {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  10% { opacity: 0.5; }
  100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
}

/* ===== 池子 ===== */
.pool {
  position: absolute;
  top: 30%;
  bottom: 0;
  width: 35%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  z-index: 2;
}

.pool.left { left: 0; }
.pool.right { right: 0; }

.pool-bg {
  position: absolute;
  inset: 0;
  background: var(--water-2);
  opacity: 0.1;
  z-index: -1;
}

.pool.win { filter: brightness(1.4) saturate(1.5); }
.pool.win .pool-bg { background: var(--gold); opacity: 0.35; }
.pool.lose { filter: brightness(0.4) saturate(0.3); }
.pool.lose .pool-bg { background: var(--blood); opacity: 0.4; }

.flag {
  width: 88px;
  height: 64px;
  font-size: 48px;
  border: 3px solid var(--pixel-3);
  box-shadow: 0 0 0 2px var(--pixel-0), 4px 4px 0 var(--shadow);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-1);
  z-index: 2;
}

.pool-name {
  font-size: 14px;
  color: var(--pixel-3);
  background: var(--bg-0);
  padding: 6px 14px;
  border: 2px solid var(--pixel-0);
  text-shadow: 1px 1px 0 var(--shadow), 0 0 4px rgba(0, 0, 0, 0.5);
  z-index: 2;
  letter-spacing: 2px;
  font-weight: bold;
}

.pool-rank {
  position: absolute;
  bottom: 50px;
  font-size: 11px;
  color: var(--pixel-2);
  background: var(--bg-0);
  padding: 4px 10px;
  border: 1px solid var(--pixel-0);
  z-index: 2;
  letter-spacing: 1px;
}

/* ===== 保罗章鱼 ===== */
.octopus {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 200px;
  height: 200px;
  z-index: 5;
  transform: translate(-50%, -50%);
  transition: left 2s cubic-bezier(0.4, 0, 0.2, 1), top 2s ease-in-out;
  pointer-events: none;
}

.octopus-emoji {
  font-size: 180px;
  line-height: 1;
  filter: drop-shadow(4px 6px 0 rgba(0, 0, 0, 0.5));
  animation: swim 2.6s ease-in-out infinite;
}

@keyframes swim {
  0%, 100% { transform: translateY(0) rotate(-3deg) scale(1); }
  50%      { transform: translateY(-6px) rotate(3deg) scale(1.04); }
}

.octopus.dying .octopus-emoji {
  animation: dying 0.18s steps(2) infinite;
  filter: drop-shadow(3px 4px 0 #b02a2a) sepia(1) hue-rotate(-30deg) saturate(2) brightness(1.1);
}

@keyframes dying {
  0%   { transform: translate(0, 0) rotate(0); }
  25%  { transform: translate(-3px, 1px) rotate(-6deg); }
  50%  { transform: translate(2px, -1px) rotate(4deg); }
  75%  { transform: translate(-1px, 2px) rotate(-2deg); }
  100% { transform: translate(0, 0) rotate(0); }
}

/* ===== 中央 ===== */
.center-overlay {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  z-index: 6;
  text-align: center;
  pointer-events: none;
}

.match-headline {
  font-size: 16px;
  color: var(--gold);
  background: var(--bg-0);
  padding: 10px 20px;
  border: 3px solid var(--gold);
  box-shadow: 0 0 0 2px var(--bg-0), 0 0 0 4px var(--pixel-0), 4px 4px 0 var(--shadow);
  text-shadow: 2px 2px 0 var(--blood), 0 0 6px rgba(255, 208, 0, 0.4);
  letter-spacing: 2px;
  font-weight: bold;
}

.match-sub {
  font-size: 12px;
  color: var(--pixel-3);
  background: var(--bg-0);
  padding: 5px 14px;
  border: 2px solid var(--pixel-0);
  font-family: 'VT323', monospace;
  letter-spacing: 1px;
}

.match-vs {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 20px;
  color: var(--gold);
  background: var(--bg-0);
  width: 48px;
  height: 48px;
  border: 3px solid var(--gold);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 4;
  box-shadow: 0 0 0 3px var(--bg-0), 0 0 0 5px var(--pixel-0);
  text-shadow: 2px 2px 0 var(--blood);
  font-weight: bold;
}

.score-overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'VT323', monospace;
  font-size: 72px;
  color: var(--gold);
  background: var(--bg-0);
  padding: 14px 30px;
  border: 5px solid var(--gold);
  z-index: 7;
  display: none;
  text-shadow: 3px 3px 0 var(--blood), 0 0 10px rgba(255, 208, 0, 0.5);
  letter-spacing: 6px;
  font-weight: bold;
}

.score-overlay.show { display: block; animation: pop 0.3s steps(4) both; }

@keyframes pop {
  0% { transform: translate(-50%, -50%) scale(0.3); }
  100% { transform: translate(-50%, -50%) scale(1); }
}

.tb-box {
  position: absolute;
  bottom: 56px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 6;
}

.tb-box .box {
  background: var(--bg-0);
  border: 2px solid var(--pixel-0);
  padding: 8px 14px;
  text-align: center;
  min-width: 110px;
}

.tb-box .k { color: var(--pixel-2); font-size: 9px; }
.tb-box .v { color: var(--gold); font-size: 16px; margin-top: 4px; font-family: 'VT323', monospace; font-weight: bold; }
.tb-box .v.ok { color: var(--green); }
.tb-box .v.danger { color: var(--blood-2); }

/* ===== 操作栏 ===== */
.action-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 12px 16px;
  background: var(--bg-1);
  border-top: 4px solid var(--pixel-0);
}

.btn {
  background: var(--bg-2);
  color: var(--pixel-3);
  border: 3px solid var(--pixel-0);
  box-shadow: 0 0 0 2px var(--bg-0), 0 0 0 3px var(--pixel-1), 4px 4px 0 var(--shadow);
  padding: 14px 16px;
  font-size: 11px;
  cursor: pointer;
  text-align: center;
  letter-spacing: 1px;
  font-weight: bold;
  transition: transform 0.1s, box-shadow 0.1s;
}

.btn:hover:not(:disabled) {
  background: var(--bg-1);
  transform: translate(-1px, -1px);
  box-shadow: 0 0 0 2px var(--bg-0), 0 0 0 3px var(--gold), 5px 5px 0 var(--shadow);
}

.btn:active:not(:disabled) {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 2px var(--bg-0), 0 0 0 3px var(--pixel-0), 0 0 0 var(--shadow);
}

.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn .ico { font-size: 22px; display: block; margin-bottom: 4px; }

.btn.feed-home { color: var(--gold); border-color: var(--gold); }
.btn.feed-home:hover:not(:disabled) { box-shadow: 0 0 0 2px var(--bg-0), 0 0 0 3px var(--fire-1), 5px 5px 0 var(--shadow); }
.btn.feed-away { color: var(--water-3); border-color: var(--water-3); }
.btn.feed-away:hover:not(:disabled) { box-shadow: 0 0 0 2px var(--bg-0), 0 0 0 3px var(--water-3), 5px 5px 0 var(--shadow); }
.btn.bet { color: var(--fire-1); border-color: var(--fire-1); }
.btn.log { color: var(--green); border-color: var(--green); }

/* ===== 侧边栏 ===== */
.sidebar {
  background: var(--bg-1);
  border-left: 4px solid var(--pixel-0);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.sidebar-header {
  padding: 14px 16px;
  background: var(--bg-2);
  border-bottom: 2px solid var(--pixel-0);
}

.sidebar-title {
  font-size: 12px;
  color: var(--gold);
  text-shadow: 2px 2px 0 var(--blood);
  letter-spacing: 1px;
}

.sidebar-sub {
  font-size: 7px;
  color: var(--pixel-2);
  margin-top: 6px;
  line-height: 1.7;
}

.timeline {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--pixel-0) var(--bg-0);
}
.timeline::-webkit-scrollbar { width: 8px; }
.timeline::-webkit-scrollbar-track { background: var(--bg-0); }
.timeline::-webkit-scrollbar-thumb { background: var(--pixel-0); }

.tl-day { margin-bottom: 12px; }

.tl-day-header {
  font-size: 11px;
  color: var(--gold);
  padding: 6px 10px;
  background: var(--bg-2);
  border-left: 4px solid var(--gold);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  font-weight: bold;
  letter-spacing: 1px;
}

.tl-day-header .count { color: var(--pixel-2); font-size: 9px; }

.tl-match {
  display: grid;
  grid-template-columns: 40px 1fr auto;
  gap: 6px;
  padding: 8px 10px;
  margin-bottom: 5px;
  background: var(--bg-0);
  border: 2px solid var(--bg-2);
  font-size: 10px;
  line-height: 1.5;
  transition: background 0.2s;
}

.tl-match:hover { background: var(--bg-2); }
.tl-match.current { border-color: var(--gold); background: var(--bg-2); box-shadow: 0 0 8px var(--gold); }
.tl-match.past { opacity: 0.55; }
.tl-match.past.dead { border-left: 6px solid var(--blood); padding-left: 4px; }
.tl-match.past.alive { border-left: 6px solid var(--green); padding-left: 4px; }

.tl-time {
  color: var(--water-3);
  font-family: 'VT323', monospace;
  font-size: 14px;
  display: flex;
  align-items: center;
  font-weight: bold;
}

.tl-teams {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 11px;
}

.tl-team { display: flex; gap: 5px; align-items: center; }
.tl-team .emo { font-size: 14px; }
.tl-team.home { color: var(--gold); }
.tl-team.away { color: var(--water-3); }
.tl-group {
  color: var(--pixel-1);
  font-size: 9px;
  margin-top: 2px;
  letter-spacing: 1px;
}

.tl-status {
  font-size: 9px;
  text-align: right;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 2px;
  font-weight: bold;
}

.tl-tag {
  padding: 2px 5px;
  border: 1px solid currentColor;
  white-space: nowrap;
  font-size: 9px;
  letter-spacing: 1px;
}

.tl-tag.live { color: var(--blood-2); animation: blink 1s steps(2) infinite; }
.tl-tag.done { color: var(--green); }
.tl-tag.next { color: var(--gold); }

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.sidebar-footer {
  padding: 12px 16px;
  background: var(--bg-2);
  border-top: 2px solid var(--pixel-0);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  font-size: 9px;
}

.sf-box {
  background: var(--bg-0);
  border: 2px solid var(--pixel-0);
  padding: 8px 10px;
}

.sf-box .k { color: var(--pixel-2); font-size: 8px; }
.sf-box .v { color: var(--gold); font-size: 14px; margin-top: 2px; font-family: 'VT323', monospace; }
.sf-box.ok .v { color: var(--green); }
.sf-box.danger .v { color: var(--blood-2); }

/* ===== Modal ===== */
.modal-mask {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal-mask.show { display: flex; }

.modal {
  background: var(--bg-1);
  border: 6px solid var(--gold);
  box-shadow: 0 0 0 4px var(--bg-0), 0 0 0 8px var(--pixel-0);
  max-width: 480px;
  width: 100%;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
}

.modal-head {
  background: var(--bg-2);
  padding: 12px 16px;
  border-bottom: 4px solid var(--gold);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: var(--gold);
  text-shadow: 2px 2px 0 var(--blood);
}

.modal-close {
  background: var(--blood);
  color: var(--pixel-3);
  border: 2px solid var(--pixel-3);
  width: 28px;
  height: 28px;
  cursor: pointer;
  font-family: inherit;
  font-size: 10px;
}

.modal-body {
  padding: 16px;
  overflow-y: auto;
  font-size: 10px;
  line-height: 1.8;
}

.modal-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px dashed var(--pixel-0);
}

.modal-row .lbl { color: var(--pixel-2); }
.modal-row .val { color: var(--gold); }

.btn-row {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
}

.btn-row .btn { flex: 1; min-width: 90px; }

input.pixel-input {
  background: var(--bg-0);
  color: var(--gold);
  border: 3px solid var(--pixel-0);
  padding: 8px 10px;
  font-family: 'VT323', monospace;
  font-size: 16px;
  width: 100%;
  outline: none;
}
input.pixel-input:focus { border-color: var(--gold); }

/* ===== BBQ / 烤架 ===== */
.bbq-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  display: none;
}
.bbq-overlay.show { display: block; }

.bbq-text {
  position: absolute;
  top: 25%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 22px;
  color: var(--fire-1);
  text-shadow: 3px 3px 0 var(--blood), 0 0 14px var(--fire-0);
  background: #000;
  padding: 16px 32px;
  border: 5px solid var(--fire-0);
  letter-spacing: 2px;
  white-space: nowrap;
  box-shadow: 0 0 20px var(--fire-0);
  animation: shake 0.08s steps(2) infinite;
}

@keyframes shake {
  0%, 100% { transform: translateX(-50%) translate(0, 0) rotate(0); }
  25%      { transform: translateX(-50%) translate(-3px, 1px) rotate(-1deg); }
  50%      { transform: translateX(-50%) translate(3px, -1px) rotate(1deg); }
  75%      { transform: translateX(-50%) translate(-2px, 2px) rotate(-0.5deg); }
}

.bbq-grill {
  position: absolute;
  bottom: 25%;
  left: 50%;
  transform: translateX(-50%);
  width: 360px;
  height: 180px;
}

.bbq-net {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 50px;
  background:
    repeating-linear-gradient(45deg, var(--pixel-0) 0 5px, transparent 5px 10px),
    repeating-linear-gradient(-45deg, var(--pixel-0) 0 5px, transparent 5px 10px);
  border: 5px solid var(--pixel-1);
  box-shadow: 0 0 12px var(--fire-0);
}

.bbq-flame {
  position: absolute;
  bottom: 30px;
  width: 80px;
  height: 120px;
  background: linear-gradient(0deg, var(--fire-0) 0%, var(--fire-1) 40%, var(--fire-2) 70%, transparent 100%);
  border-radius: 50% 50% 20% 20% / 80% 80% 20% 20%;
  animation: flicker 0.15s steps(2) infinite;
  filter: blur(3px);
  box-shadow: 0 0 30px var(--fire-0);
}
.bbq-flame.f1 { left: 40px; height: 130px; }
.bbq-flame.f2 { left: 140px; height: 160px; animation-delay: 0.05s; }
.bbq-flame.f3 { left: 240px; height: 120px; animation-delay: 0.1s; }

@keyframes flicker {
  0%, 100% { transform: scaleY(1) scaleX(1) translateY(0); }
  50%      { transform: scaleY(1.15) scaleX(0.92) translateY(-4px); }
}

.bbq-octopus {
  position: absolute;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 80px;
  filter: sepia(0.7) hue-rotate(-30deg) saturate(1.8) brightness(0.85);
  animation: bbqspin 1.5s linear infinite;
  line-height: 1;
}

@keyframes bbqspin {
  0%   { transform: translateX(-50%) rotate(-8deg); }
  50%  { transform: translateX(-50%) rotate(8deg); }
  100% { transform: translateX(-50%) rotate(-8deg); }
}

.bbq-count {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: var(--gold);
  background: #000;
  padding: 8px 16px;
  border: 3px solid var(--gold);
  letter-spacing: 1px;
}

/* ===== 红屏闪 + 血溅 ===== */
.kill-flash {
  position: fixed;
  inset: 0;
  background: var(--blood);
  z-index: 999;
  pointer-events: none;
  animation: kill-flash 0.6s steps(4) forwards;
}
@keyframes kill-flash {
  0%   { opacity: 0; }
  20%  { opacity: 0.95; }
  40%  { opacity: 0.4; }
  60%  { opacity: 0.8; }
  100% { opacity: 0; }
}

.splash {
  position: fixed;
  width: 12px;
  height: 12px;
  background: var(--blood);
  border-radius: 50%;
  z-index: 998;
  pointer-events: none;
  box-shadow: 0 0 4px var(--blood-2);
  animation: splash-fly 0.8s ease-out forwards;
}

@keyframes splash-fly {
  0%   { transform: translate(0, 0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-0);
  border: 3px solid var(--gold);
  padding: 12px 24px;
  font-size: 12px;
  color: var(--gold);
  z-index: 200;
  box-shadow: 0 0 0 2px var(--bg-0), 4px 4px 0 var(--shadow);
  display: none;
  animation: toast-in 0.2s steps(4);
}
.toast.show { display: block; }

@keyframes toast-in {
  0%   { transform: translateX(-50%) translateY(-20px); opacity: 0; }
  100% { transform: translateX(-50%) translateY(0); opacity: 1; }
}

/* ===== 战报 ===== */
.report-item {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 8px;
  padding: 8px 6px;
  border-bottom: 2px solid var(--bg-2);
  font-size: 9px;
  align-items: center;
}
.report-item .ri-mid { color: var(--pixel-2); font-size: 8px; }
.report-item .ri-outcome { font-size: 8px; padding: 3px 6px; }
.report-item .ri-outcome.win { background: var(--green); color: var(--bg-0); }
.report-item .ri-outcome.lose { background: var(--blood); color: var(--pixel-3); }

/* ===== 骨堆 ===== */
.bone-pile {
  position: absolute;
  bottom: 50px;
  z-index: 2;
  font-size: 12px;
  display: flex;

.bone-pile.left  { left: 8px; }

.bone-pile .b { opacity: 0.5; transition: opacity 0.3s; }
.bone-pile .b.fresh { opacity: 1; color: var(--blood-2); animation: bone-pop 0.3s steps(2) 3; }
@keyframes bone-pop {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.4); }
}

/* ========== 工具 ========== */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

let state = loadState();
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return { ...defaultState, ...JSON.parse(raw) };
  } catch (e) {}
  return { ...defaultState };
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
function resetGame() {
  if (!confirm('真的要重置赛季吗？所有 🐙 和战报都会清空。')) return;
  state = { ...defaultState };
  state.currentMatchIdx = findNextMatchIdx();
  saveState();
  renderAll();
  toast('已重置。8 只章鱼已下水。');
}

function getKickoffDate(m) {
  if (m.tbd) return null;
  return new Date(`${m.date}T${m.kickoff}:00+08:00`);
}
function fmtCountdown(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h >= 24) {
    const d = Math.floor(h / 24);
    return `${d}天 ${h % 24}h`;
  }
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}
function fmtClock(d) {
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
}
function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function findCurrentMatchIdx() {
  const now = Date.now();
  let nextUpcoming = -1, currentLive = -1;
  for (let i = 0; i < SCHEDULE.length; i++) {
    const m = SCHEDULE[i];
    if (m.tbd) continue;
    const ko = getKickoffDate(m);
    if (!ko) continue;
    const koTime = ko.getTime();
    if (koTime > now && nextUpcoming === -1) nextUpcoming = i;
    if (koTime <= now && now < koTime + 2 * 3600 * 1000) currentLive = i;
  }
  if (currentLive >= 0) {
    const verdict = state.history.find(h => h.matchIdx === currentLive);
    if (!verdict || !verdict.verdict) return currentLive;
  }
  for (let i = 0; i < SCHEDULE.length; i++) {
    const m = SCHEDULE[i];
    if (m.tbd) continue;
    const ko = getKickoffDate(m);
    if (!ko) continue;
    if (ko.getTime() > now) break;
    const verdict = state.history.find(h => h.matchIdx === i);
    if (!verdict || !verdict.verdict) return i;
  }
  if (nextUpcoming >= 0) return nextUpcoming;
  return Math.min(state.currentMatchIdx, SCHEDULE.length - 1);
}
function findNextMatchIdx() {
  const now = Date.now();
  for (let i = 0; i < SCHEDULE.length; i++) {
    const ko = getKickoffDate(SCHEDULE[i]);
    if (!ko) continue;
    if (ko.getTime() > now) return i;
  }
  return SCHEDULE.length - 1;
}
function getPhase(m) {
  if (m.tbd) return 'tbd';
  const ko = getKickoffDate(m);
  if (!ko) return 'tbd';
  const ms = ko.getTime() - Date.now();
  const verdict = state.history.find(h => h.matchIdx === state.currentMatchIdx);
  if (verdict && verdict.verdict) return 'finished';
  if (ms > 24 * 3600 * 1000) return 'pre';
  if (ms > 0) return 'soon';
  if (ms > -2 * 3600 * 1000) return 'live';
  return 'overdue';
}
function phaseCN(phase) {
  return ({ pre: '未开赛', soon: '即将开赛', live: '进行中', overdue: '待结果', finished: '已揭晓', tbd: '待定' })[phase] || phase;
}

/* ========== 🐙 预测 AI ========== */
function octopusPick(match) {
  const home = TEAMS[match.home], away = TEAMS[match.away];
  if (!home || !away) return 'home';
  const homeStrength = (200 - home.rank) + 30;
  const awayStrength = (200 - away.rank);
  // 投喂加权
  const total = state.fedHome + state.fedAway;
  let pHome = homeStrength / (homeStrength + awayStrength);
  if (total > 0) {
    const fed = state.fedHome / total;
    pHome = (pHome * 0.6) + (fed * 0.4);
  }
  return Math.random() < pHome ? 'home' : 'away';
}

  $('#hud-octopus').textContent = `× ${state.octopusAlive}`;
  $('#hud-record').textContent = `${state.correctCount} / ${state.correctCount + state.wrongCount}`;
  $('#hud-bbq').textContent = `${state.octopusEaten}`;
  $('#sf-acc').textContent = (state.correctCount + state.wrongCount) === 0 ? '--%' :
    Math.round(state.correctCount / (state.correctCount + state.wrongCount) * 100) + '%';
  $('#sf-eaten').textContent = `${state.octopusEaten} / ${state.octopusTotal}`;
}

function renderStage() {
  const idx = state.currentMatchIdx;
  const m = SCHEDULE[idx];
  if (!m) return;
  if (m.tbd) {
    $('#flag-left').textContent = '❓';
    $('#flag-right').textContent = '❓';
    $('#name-left').textContent = '待定';
    $('#name-right').textContent = '待定';
    $('#rank-left').textContent = '';
    $('#rank-right').textContent = '';
    $('#match-title').textContent = `🏆 ${m.stage}`;
    $('#match-sub').textContent = m.date;
    return;
  }
  const home = TEAMS[m.home], away = TEAMS[m.away];
  $('#flag-left').textContent = home.flag;
  $('#flag-right').textContent = away.flag;
  $('#name-left').textContent = home.name;
  $('#name-right').textContent = away.name;
  $('#rank-left').textContent = `FIFA #${home.rank} · ${home.group}组`;
  $('#rank-right').textContent = `FIFA #${away.rank} · ${away.group}组`;

  const phase = getPhase(m);
  $('#match-vs').style.display = phase === 'finished' ? 'none' : 'flex';
  if (state.currentPrediction === 'home') $('#match-vs').textContent = '←';
  else if (state.currentPrediction === 'away') $('#match-vs').textContent = '→';
  else $('#match-vs').textContent = 'VS';

  $('#pool-left').classList.remove('win', 'lose');
  $('#pool-right').classList.remove('win', 'lose');
  const verdict = state.history.find(h => h.matchIdx === idx);
  if (verdict && verdict.verdict) {
    if (verdict.result === 'home') $('#pool-left').classList.add('win');
    else if (verdict.result === 'away') $('#pool-right').classList.add('win');
  } else if (verdict && verdict.verdict === 'wrong') {
    if (state.currentPrediction === 'home') $('#pool-left').classList.add('lose');
    else $('#pool-right').classList.add('lose');
  }

  const ko = getKickoffDate(m);
  const ms = ko ? ko.getTime() - Date.now() : 0;
  const stageShort = m.stage.replace('小组赛', '小组');
  $('#match-title').textContent = `⚽ ${stageShort} · ${m.date.slice(5)}`;
  if (ms > 0) {
    $('#match-sub').textContent = `⏳ 距开球 ${fmtCountdown(ms)} · 北京时间 ${m.kickoff}`;
  } else if (ms > -2 * 3600 * 1000) {
    $('#match-sub').textContent = `🔴 进行中 · 开球 ${m.kickoff}`;
  } else {
    $('#match-sub').textContent = `⏱ 已结束 · 等结果`;
  }

  $('#tb-phase').textContent = phaseCN(phase);
  if (ms > 0) {
    $('#tb-countdown').textContent = fmtCountdown(ms);
    $('#tb-countdown').className = 'v';
  } else if (ms > -2 * 3600 * 1000) {
    $('#tb-countdown').textContent = '进行中';
    $('#tb-countdown').className = 'v ok';
  } else {
    $('#tb-countdown').textContent = '待输入';
    $('#tb-countdown').className = 'v danger';
  }
  const octoState = state.currentLocked ? (state.currentPrediction === 'home' ? '锁定·主' : '锁定·客') : '巡游中';
  $('#tb-octo-state').textContent = octoState;

  moveOctopus();
}

function renderTimeline() {
  const tl = $('#timeline');
  const grouped = {};
  SCHEDULE.forEach((m, i) => {
    const k = m.date;
    if (!grouped[k]) grouped[k] = [];
    grouped[k].push({ ...m, _idx: i });
  });
  let html = '';
  for (const date of Object.keys(grouped)) {
    const matches = grouped[date];
    const d = new Date(date + 'T00:00:00+08:00');
    const wd = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
    const isToday = isSameDay(d, new Date());
    html += `<div class="tl-day">`;
    html += `<div class="tl-day-header"><span class="date">${date.slice(5)} 周${wd}${isToday ? ' · 🔥 今日' : ''}</span><span class="count">${matches.length} 场</span></div>`;
    for (const m of matches) {
      const home = TEAMS[m.home];
      const away = TEAMS[m.away];
      const isCurrent = m._idx === state.currentMatchIdx;
      const ko = getKickoffDate(m);
      const koMs = ko ? ko.getTime() - Date.now() : -1;
      const past = koMs < -2 * 3600 * 1000;
      const verdict = state.history.find(h => h.matchIdx === m._idx);
      let cls = 'tl-match';
      if (isCurrent) cls += ' current';
      if (past) cls += ' past';
      if (verdict) cls += verdict.verdict === 'correct' ? ' alive' : ' dead';
      let tag = '';
      if (m.tbd) tag = '<span class="tl-tag">待定</span>';
      else if (verdict && verdict.verdict) {
        tag = verdict.verdict === 'correct' ? '<span class="tl-tag done">✓ 活</span>' : '<span class="tl-tag" style="color:var(--blood-2)">✕ 烤</span>';
      } else if (koMs > 24 * 3600 * 1000) tag = `<span class="tl-tag" style="color:var(--pixel-2)">${fmtCountdown(koMs)}</span>`;
      else if (koMs > 0) tag = `<span class="tl-tag next">⏱ ${fmtCountdown(koMs)}</span>`;
      else if (koMs > -2 * 3600 * 1000) tag = '<span class="tl-tag live">● 进行中</span>';
      else tag = '<span class="tl-tag" style="color:var(--blood-2)">待输入</span>';
      if (m.tbd) {
        html += `<div class="${cls}">
          <div class="tl-time">${m.date.slice(5)}</div>
          <div class="tl-teams"><div class="tl-team" style="color:var(--pixel-1)">${m.stage}</div></div>
          <div class="tl-status">${tag}</div>
        </div>`;
      } else {
        html += `<div class="${cls}" data-idx="${m._idx}">
          <div class="tl-time">${m.kickoff}</div>
          <div class="tl-teams">
            <div class="tl-team home"><span class="emo">${home.flag}</span>${home.name}</div>
            <div class="tl-team away"><span class="emo">${away.flag}</span>${away.name}</div>
            <div class="tl-group">${m.stage}</div>
          </div>
          <div class="tl-status">${tag}</div>
        </div>`;
      }
    }
    html += `</div>`;
  }
  tl.innerHTML = html;
  tl.querySelectorAll('.tl-match[data-idx]').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      if (SCHEDULE[idx].tbd) { toast('该阶段还未抽签 🐙'); return; }
      state.currentMatchIdx = idx;
      const verdict = state.history.find(h => h.matchIdx === idx);
      state.currentPrediction = verdict ? null : (verdict?.prediction ?? null);
      state.currentLocked = !!verdict;
      saveState();
      renderAll();
    });
  });
}

function renderBonePile() {
  const counts = { home: 0, away: 0 };
  state.history.forEach(h => {
    if (h.verdict === 'wrong' && h.prediction) counts[h.prediction]++;
  });
  $('#bone-pile-left').innerHTML = Array(counts.home).fill('🦴').map(b => `<span class="b">${b}</span>`).join('');
  $('#bone-pile-right').innerHTML = Array(counts.away).fill('🦴').map(b => `<span class="b">${b}</span>`).join('');
}

function moveOctopus() {
  const octo = $('#octopus');
  const tank = $('#tank');
  if (!tank) return;
  const tw = tank.clientWidth;
  const th = tank.clientHeight;
  const phase = getPhase(SCHEDULE[state.currentMatchIdx]);
  const pred = state.currentPrediction;
  let tx = tw * 0.5, ty = th * 0.5;
  if (pred === 'home') { tx = tw * 0.18; ty = th * 0.55; }
  else if (pred === 'away') { tx = tw * 0.82; ty = th * 0.55; }
  else if (phase === 'pre') { tx = tw * (0.3 + Math.random() * 0.4); ty = th * (0.4 + Math.random() * 0.3); }
  octo.style.left = tx + 'px';
  octo.style.top = ty + 'px';
}

/* ========== 投喂 ========== */
function feed(side) {
  if (state.currentLocked) {
    toast('🐙 哥已经决定了，再投也没用');
    return;
  }
  if (side === 'home') state.fedHome++;
  else state.fedAway++;
  moveOctopus();
  audio.beep();
  const m = SCHEDULE[state.currentMatchIdx];
  const teamName = TEAMS[side === 'home' ? m.home : m.away].name;
  toast(`投喂了 ${teamName}（${side === 'home' ? state.fedHome : state.fedAway} 次）`);
  saveState();
}

/* ========== 行刑：揭晓比赛结果 ========== */
function executeVerdict(result) {
  const idx = state.currentMatchIdx;
  const m = SCHEDULE[idx];
  if (!m) return;
  const predict = state.currentPrediction;
  const correct = (result === 'draw' ? false : predict === result);

  state.history.push({
    matchIdx: idx,
    match: `${m.home} vs ${m.away}`,
    prediction: predict,
    result,
    verdict: correct ? 'correct' : 'wrong',
    time: Date.now(),
  });

  if (correct) {
    state.correctCount++;
    audio.fanfare();
    $('#octopus').classList.add('dying'); // 用一个 class 触发
    setTimeout(() => $('#octopus').classList.remove('dying'), 1500);
    toast('🎉 押中了！🐙 哥得意地吐了口墨水。');
  } else {
    state.wrongCount++;
    state.octopusEaten++;
    state.octopusAlive = Math.max(0, state.octopusAlive - 1);
    audio.scream();
    setTimeout(() => audio.shoot(), 350);
    setTimeout(() => audio.sizzle(), 700);
    $('#octopus').classList.add('dying');
    showBBQ(predict);
    setTimeout(() => $('#octopus').classList.remove('dying'), 3500);
  }

  state.currentPrediction = null;
  state.currentLocked = false;
  state.fedHome = 0;
  state.fedAway = 0;
  state.deadId++;

  setTimeout(() => {
    const next = findCurrentMatchIdx();
    state.currentMatchIdx = next;
    saveState();
    renderAll();
  }, correct ? 2000 : 4500);
}

function showBBQ(predict) {
  const m = SCHEDULE[state.currentMatchIdx];
  const teamName = TEAMS[predict === 'home' ? m.home : m.away].name;
  $('#bbq-text').textContent = `🍢 烤了一只！${teamName}粉已下肚`;
  $('#bbq-count').textContent = `🍢 累计烧烤：${state.octopusEaten} 只 · 还剩 ${state.octopusAlive} 只`;
  $('#bbq').classList.add('show');
  // 红屏闪 + 血溅
  showKillFlash();
  // 加一根骨
  addBone(predict);
  setTimeout(() => $('#bbq').classList.remove('show'), 3500);
}

function showKillFlash() {
  const flash = document.createElement('div');
  flash.className = 'kill-flash';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 600);
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  for (let i = 0; i < 24; i++) {
    const s = document.createElement('div');
    s.className = 'splash';
    s.style.left = cx + 'px';
    s.style.top = cy + 'px';
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 280;
    s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    s.style.background = Math.random() < 0.3 ? '#ff3a3a' : '#b02a2a';
    s.style.width = (6 + Math.random() * 12) + 'px';
    s.style.height = s.style.width;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 800);
  }
}

function addBone(side) {
  const counts = { home: 0, away: 0 };
  state.history.forEach(h => {
    if (h.verdict === 'wrong' && h.prediction) counts[h.prediction]++;
  });
  const el = side === 'home' ? $('#bone-pile-left') : $('#bone-pile-right');
  el.innerHTML = Array(counts[side]).fill('🦴').map((b, i) => `<span class="b${i === counts[side] - 1 ? ' fresh' : ''}">${b}</span>`).join('');
  const el2 = side === 'home' ? $('#bone-pile-right') : $('#bone-pile-left');
  el2.innerHTML = Array(counts[side === 'home' ? 'away' : 'home']).fill('🦴').join('');
}

    </div>
  `;
  openModal(`📥 输入结果 · ${home.flag}${home.name} vs ${away.flag}${away.name}`, body);
}

/* ========== 战报 ========== */
function showReport() {
  const body = `
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 12px;">
      <div class="sf-box"><div class="k">🐙 存活</div><div class="v ok">${state.octopusAlive}</div></div>
      <div class="sf-box danger"><div class="k">🍢 已烤</div><div class="v">${state.octopusEaten}</div></div>
      <div class="sf-box"><div class="k">✓ 正确</div><div class="v ok">${state.correctCount}</div></div>
      <div class="sf-box"><div class="k">✕ 错误</div><div class="v danger">${state.wrongCount}</div></div>
    </div>
    <p style="color: var(--gold); font-size: 9px; margin-bottom: 8px;">📜 历史战报</p>
    <div style="max-height: 320px; overflow-y: auto;">
      ${state.history.length === 0 ? '<p style="color: var(--pixel-1); font-size: 9px; text-align: center; padding: 20px;">还没战绩。等待开赛。</p>' :
        state.history.slice().reverse().map(h => {
          const m = SCHEDULE[h.matchIdx];
          return `<div class="report-item">
            <div>
              <div style="color: var(--pixel-3); font-size: 8px;">${m ? m.date + ' ' + m.kickoff : '?'}</div>
              <div style="color: var(--pixel-2); font-size: 7px;">${h.match}</div>
            </div>
            <div class="ri-mid">押: ${h.prediction === 'home' ? '主' : h.prediction === 'away' ? '客' : '—'} → ${h.result === 'home' ? '主' : h.result === 'away' ? '客' : '平'}</div>
            <div class="ri-outcome ${h.verdict}">${h.verdict === 'correct' ? '✓ 活' : '✕ 烤'}</div>
          </div>`;
        }).join('')
      }
    </div>
    <div class="btn-row">
      <button class="btn log" onclick="exportData()">💾 导出数据</button>
      <button class="btn" style="color: var(--blood-2)" onclick="resetGame()">🗑 重置赛季</button>
    </div>
  `;
  openModal('📜 战报历史 · 整个赛季', body);
}

/* ========== 观众竞猜 ========== */
const ODDS = [100, 50, 20, 10, 5, 3, 2, 1.5, 1.2];

function showBetting() {
  const body = `
    <p style="color: var(--pixel-2); font-size: 9px; line-height: 1.8; margin-bottom: 10px;">
      押注：本届世界杯结束前，一共能吃几只 🐙？<br>
      猜中将以"先知"身份入选名人堂。
    </p>
    ${renderOddsTable()}
    <div style="display: flex; gap: 8px; align-items: center; margin-top: 10px;">
      <input class="pixel-input" id="bet-name" placeholder="你的名号" maxlength="12" style="flex: 1;">
      <input class="pixel-input" id="bet-guess" type="number" min="0" max="8" placeholder="几只" style="width: 80px;">
    </div>
    <div class="btn-row">
      <button class="btn bet" onclick="submitBet()">🎰 下 注</button>
      <button class="btn" onclick="closeModal()">取消</button>
    </div>
    <div id="bet-list" style="margin-top: 14px;"></div>
  `;
  openModal('🎰 观众竞猜 · 吃几只 🐙', body);
  renderBetList();
}

function renderOddsTable() {
  const totals = [0, 0, 0, 0, 0, 0, 0, 0, 0];
  state.bets.forEach(b => { if (b.guess >= 0 && b.guess <= 8) totals[b.guess]++; });
  const eaten = state.octopusEaten;
  const alive = state.octopusAlive;
  return `<div style="display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; margin: 10px 0;">
    ${ODDS.map((base, i) => {
      let cls = '';
      let oo = base + 'x';
      if (i <= eaten) { cls = 'loser'; oo = '✕'; }
      else if (i === eaten + 1) { cls = 'edge'; oo = (base * 0.5).toFixed(2) + 'x'; }
      else if (i > eaten + 1) {
        const factor = Math.max(0.5, 1 - alive / state.octopusTotal);
        oo = Math.max(1.05, base * factor).toFixed(2) + 'x';
      }
      const style = cls === 'loser' ? 'background:var(--bg-0);border:2px solid var(--blood);opacity:0.4;color:var(--pixel-1);' :
                  cls === 'edge' ? 'background:var(--bg-0);border:2px solid var(--gold);' :
                  'background:var(--bg-0);border:2px solid var(--pixel-0);';
      return `<div style="${style} padding: 6px 2px; text-align: center;">
        <div style="color:var(--pixel-2);font-size:7px;">押${i}只</div>
        <div style="color:${cls === 'loser' ? 'var(--pixel-1)' : 'var(--gold)'};font-size:11px;margin:2px 0;font-family:'VT323',monospace;">${oo}</div>
        <div style="color:var(--water-3);font-size:7px;">👥${totals[i]}</div>
      </div>`;
    }).join('')}
  </div>
  <p style="text-align: center; color: var(--pixel-1); font-size: 8px; margin-top: 6px;">
    当前已烤 <span style="color:var(--blood-2)">${eaten}</span> 只 · 赔率随比赛进行实时调整
  </p>`;
}

function submitBet() {
  const name = $('#bet-name').value.trim() || '匿名看客';
  const guess = parseInt($('#bet-guess').value);
  if (isNaN(guess) || guess < 0 || guess > 8) {
    toast('请输入 0-8 之间的数字');
    return;
  }
  state.bets.push({ name, guess, time: Date.now() });
  saveState();
  $('#bet-name').value = '';
  $('#bet-guess').value = '';
  audio.beep();
  toast(`已下注：${name} 猜吃 ${guess} 只`);
  showBetting();
}

function renderBetList() {
  const el = $('#bet-list');
  if (el) el.innerHTML = renderBetListHtml();
}

function renderBetListHtml() {
  if (state.bets.length === 0) {
    return '<p style="color: var(--pixel-1); font-size: 8px; text-align: center; padding: 20px;">还没人下注，来当第一个预言家。</p>';
  }
  const sorted = [...state.bets].sort((a, b) => a.guess - b.guess);
  return `
    <p style="color: var(--gold); font-size: 9px; margin: 12px 0 6px;">👥 观众下注榜（共 ${state.bets.length} 人）</p>
    <div style="max-height: 220px; overflow-y: auto;">
      ${sorted.map(b => {
        const cls = b.guess < state.octopusEaten ? 'loser' : b.guess === state.octopusEaten ? 'edge' : '';
        const style = cls === 'loser' ? 'opacity:0.4;' : cls === 'edge' ? 'color:var(--green);' : '';
        return `<div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--bg-0); border: 2px solid var(--pixel-0); margin-bottom: 4px; ${style}">
          <span style="color: var(--pixel-3); font-size: 9px;">${b.name}</span>
          <span style="color: var(--gold); font-size: 10px; font-family: 'VT323', monospace;">${b.guess} 只</span>
        </div>`;
      }).join('')}
    </div>
  `;
}

/* ========== Modal & Toast ========== */
function openModal(title, body) {
  $('#modal-title').textContent = title;
  $('#modal-body').innerHTML = body;
  $('#modal').classList.add('show');
}
function closeModal() { $('#modal').classList.remove('show'); }

let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `octopus-worldcup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出存档');
}

/* ========== 8-bit 音效（Web Audio） ========== */
let audioCtx = null;
function getCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  return audioCtx;
}
function beep(freq, dur, type = 'square', vol = 0.05) {
  const ctx = getCtx();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + dur);
}
const audio = {
  beep: () => beep(660, 0.05),
  shoot: () => { beep(80, 0.4, 'sawtooth', 0.2); setTimeout(() => beep(40, 0.3, 'sawtooth', 0.15), 100); },
  scream: () => {
    const ctx = getCtx(); if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(900, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.6);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.65);
  },
  sizzle: () => {
    for (let i = 0; i < 12; i++) {
      setTimeout(() => beep(800 + Math.random() * 600, 0.04, 'square', 0.04), i * 60);
    }
  },
  fanfare: () => {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.15), i * 100));
  },
};

/* ========== 气泡 ========== */
function spawnBubbles() {
  const tank = $('#tank');
  tank.querySelectorAll('.bubble').forEach(b => b.remove());
  for (let i = 0; i < 12; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 4 + Math.random() * 8;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = (Math.random() * 100) + '%';
    b.style.animationDuration = (5 + Math.random() * 8) + 's';
    b.style.animationDelay = (Math.random() * 5) + 's';
    tank.appendChild(b);
  }
}

/* ========== 循环 ========== */
function tick() {
  const now = new Date();
  $('#clock').textContent = fmtClock(now);

  // 自动推进比赛
  const target = findCurrentMatchIdx();
  if (target !== state.currentMatchIdx) {
    state.currentMatchIdx = target;
    state.fedHome = 0;
    state.fedAway = 0;
    const m = SCHEDULE[target];
    if (m && !m.tbd) {
      state.currentPrediction = octopusPick(m);
      state.currentLocked = true;
    }
    saveState();
  }

  renderTop();
  renderStage();
  renderTimeline();
  renderBonePile();
}

function renderAll() {
  renderTop();
  renderStage();
  renderTimeline();
  renderBonePile();
}

/* ========== 事件 ========== */
$('#btn-feed-home').addEventListener('click', () => feed('home'));
$('#btn-feed-away').addEventListener('click', () => feed('away'));
$('#btn-bet').addEventListener('click', showBetting);
$('#btn-log').addEventListener('click', showReport);
$('#modal-close').addEventListener('click', closeModal);
$('#modal').addEventListener('click', (e) => { if (e.target === $('#modal')) closeModal(); });

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key === '1') feed('home');
  if (e.key === '2') feed('away');
  if (e.key === '3') showBetting();
  if (e.key === '4') showReport();
  if (e.key === ' ') { e.preventDefault(); showResultInput(); }
});

window.executeVerdict = executeVerdict;
window.submitBet = submitBet;
window.exportData = exportData;
window.resetGame = resetGame;
window.closeModal = closeModal;

/* ========== 启动 ========== */
function init() {
  spawnBubbles();

  // 初始化 currentMatchIdx
  state.currentMatchIdx = findCurrentMatchIdx();
  const m = SCHEDULE[state.currentMatchIdx];
  if (m && !m.tbd) {
    state.currentPrediction = octopusPick(m);
    state.currentLocked = true;
  }
  saveState();
  renderAll();

  setInterval(tick, 1000);
  tick();
  setInterval(spawnBubbles, 10 * 60 * 1000);

  // 第一次用户点击激活音频
  document.addEventListener('click', () => getCtx(), { once: true });
}

init();
</script>
